<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>예승 English</title>
  
  <!-- PWA 및 모바일 단독 앱(Standalone) 실행 설정 -->
  <meta name="theme-color" content="#FFF6E9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="예승 English">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3898/3898082.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3898/3898082.png">

  <!-- 폰트 설정 (Fredoka & Jua) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FFF6E9;
      --card: #FFFFFF;
      --primary: #FF8A00;
      --primary-light: #FFE8CC;
      --secondary: #4ECDC4;
      --accent: #FF6B6B;
      --text: #332E2A;
      --muted: #8C827A;
      --border: #F0E4D4;
      --success: #2ECC71;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Jua', sans-serif;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    .en {
      font-family: 'Fredoka', sans-serif;
      letter-spacing: 0.5px;
    }

    /* 상단 헤더 */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 246, 233, 0.95);
      backdrop-filter: blur(8px);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
    }

    .brand {
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .star-badge {
      background: var(--card);
      border: 2px solid #FFD166;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 0 #F4C44E;
    }

    .icon-btn {
      background: var(--card);
      border: 2px solid var(--border);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border);
    }

    .icon-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border);
    }

    /* 메인 컨테이너 */
    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 5px 0 var(--border);
    }

    .greeting-banner {
      background: linear-gradient(135deg, #FF9F1C 0%, #FFBF69 100%);
      color: white;
      border: none;
      box-shadow: 0 5px 0 #E08200;
    }

    .greeting-banner h2 {
      margin: 0 0 6px 0;
      font-size: 1.35rem;
       font-weight: normal;
    }

    .greeting-banner p {
      margin: 0;
      opacity: 0.95;
      font-size: 0.95rem;
    }

    .progress-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .progress-pill {
      flex: 1;
      background: rgba(255, 255, 255, 0.25);
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title {
      font-size: 1.2rem;
      margin: 8px 0 12px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 단어 카드 리스트 */
    .word-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 4px 0 var(--border);
      transition: transform 0.1s;
    }

    .word-item.done {
      background: #F4FBF7;
      border-color: #B8EBD0;
      box-shadow: 0 4px 0 #B8EBD0;
    }

    .word-left {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      flex: 1;
    }

    .word-emoji {
      font-size: 2.2rem;
      width: 52px;
      height: 52px;
      background: var(--bg);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .word-text .en-word {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .word-text .ko-word {
      font-size: 1rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .word-text .ko-word.masked {
      background: var(--border);
      color: transparent;
      border-radius: 6px;
      padding: 0 8px;
      display: inline-block;
    }

    /* 버튼 스타일 */
    .btn {
      font-family: 'Jua', sans-serif;
      border: none;
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: translateY(2px);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 0 #CC6E00;
    }

    .btn-secondary {
      background: var(--secondary);
      color: white;
      box-shadow: 0 4px 0 #3AA69F;
    }

    .btn-done {
      background: #E8F8F0;
      color: var(--success);
      border: 2px solid #B8EBD0;
      box-shadow: none;
    }

    .btn-outline {
      background: var(--card);
      color: var(--text);
      border: 2px solid var(--border);
      box-shadow: 0 3px 0 var(--border);
    }

    /* 듣기 퀴즈 */
    .quiz-box {
      text-align: center;
      padding: 24px 16px;
    }

    .speaker-big {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 3rem;
      border: none;
      box-shadow: 0 8px 0 #CC6E00;
      cursor: pointer;
      margin: 12px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .speaker-big:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #CC6E00;
    }

    .quiz-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .quiz-option {
      background: var(--card);
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 16px 10px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-family: 'Jua', sans-serif;
    }

    .quiz-option.correct {
      background: #E8F8F0;
      border-color: var(--success);
      box-shadow: 0 5px 0 var(--success);
    }

    .quiz-option.wrong {
      background: #FFF0F0;
      border-color: var(--accent);
      box-shadow: 0 5px 0 var(--accent);
    }

    /* 카테고리 필터 */
    .cat-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .cat-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      font-family: 'Jua', sans-serif;
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: 99px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .cat-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* 하단 탭 네비게이션 */
    nav.tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 2px solid var(--border);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      z-index: 30;
    }

    nav.tabs .inner {
      max-width: 520px;
      margin: 0 auto;
      display
