<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>예승 English</title>
  
  <!-- PWA 및 모바일 단독 앱(Standalone) 실행 설정 -->
  <meta name="theme-color" content="#FFF6E9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="예승 English">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3898/3898082.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3898/3898082.png">

  <!-- 폰트 설정 (Fredoka & Jua) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FFF6E9;
      --card: #FFFFFF;
      --primary: #FF8A00;
      --primary-light: #FFE8CC;
      --secondary: #4ECDC4;
      --accent: #FF6B6B;
      --text: #332E2A;
      --muted: #8C827A;
      --border: #F0E4D4;
      --success: #2ECC71;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Jua', sans-serif;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    .en {
      font-family: 'Fredoka', sans-serif;
      letter-spacing: 0.5px;
    }

    /* 상단 헤더 */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 246, 233, 0.95);
      backdrop-filter: blur(8px);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
    }

    .brand {
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .star-badge {
      background: var(--card);
      border: 2px solid #FFD166;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 0 #F4C44E;
    }

    .icon-btn {
      background: var(--card);
      border: 2px solid var(--border);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border);
    }

    .icon-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border);
    }

    /* 메인 컨테이너 */
    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 5px 0 var(--border);
    }

    .greeting-banner {
      background: linear-gradient(135deg, #FF9F1C 0%, #FFBF69 100%);
      color: white;
      border: none;
      box-shadow: 0 5px 0 #E08200;
    }

    .greeting-banner h2 {
      margin: 0 0 6px 0;
      font-size: 1.35rem;
       font-weight: normal;
    }

    .greeting-banner p {
      margin: 0;
      opacity: 0.95;
      font-size: 0.95rem;
    }

    .progress-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .progress-pill {
      flex: 1;
      background: rgba(255, 255, 255, 0.25);
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title {
      font-size: 1.2rem;
      margin: 8px 0 12px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 단어 카드 리스트 */
    .word-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 4px 0 var(--border);
      transition: transform 0.1s;
    }

    .word-item.done {
      background: #F4FBF7;
      border-color: #B8EBD0;
      box-shadow: 0 4px 0 #B8EBD0;
    }

    .word-left {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      flex: 1;
    }

    .word-emoji {
      font-size: 2.2rem;
      width: 52px;
      height: 52px;
      background: var(--bg);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .word-text .en-word {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .word-text .ko-word {
      font-size: 1rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .word-text .ko-word.masked {
      background: var(--border);
      color: transparent;
      border-radius: 6px;
      padding: 0 8px;
      display: inline-block;
    }

    /* 버튼 스타일 */
    .btn {
      font-family: 'Jua', sans-serif;
      border: none;
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: translateY(2px);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 0 #CC6E00;
    }

    .btn-secondary {
      background: var(--secondary);
      color: white;
      box-shadow: 0 4px 0 #3AA69F;
    }

    .btn-done {
      background: #E8F8F0;
      color: var(--success);
      border: 2px solid #B8EBD0;
      box-shadow: none;
    }

    .btn-outline {
      background: var(--card);
      color: var(--text);
      border: 2px solid var(--border);
      box-shadow: 0 3px 0 var(--border);
    }

    /* 듣기 퀴즈 */
    .quiz-box {
      text-align: center;
      padding: 24px 16px;
    }

    .speaker-big {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 3rem;
      border: none;
      box-shadow: 0 8px 0 #CC6E00;
      cursor: pointer;
      margin: 12px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .speaker-big:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #CC6E00;
    }

    .quiz-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .quiz-option {
      background: var(--card);
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 16px 10px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-family: 'Jua', sans-serif;
    }

    .quiz-option.correct {
      background: #E8F8F0;
      border-color: var(--success);
      box-shadow: 0 5px 0 var(--success);
    }

    .quiz-option.wrong {
      background: #FFF0F0;
      border-color: var(--accent);
      box-shadow: 0 5px 0 var(--accent);
    }

    /* 카테고리 필터 */
    .cat-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .cat-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      font-family: 'Jua', sans-serif;
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: 99px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .cat-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* 하단 탭 네비게이션 */
    nav.tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 2px solid var(--border);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      z-index: 30;
    }

    nav.tabs .inner {
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    nav.tabs button {
      background: none;
      border: none;
      font-family: 'Jua', sans-serif;
      font-size: 0.9rem;
      color: var(--muted);
      padding: 8px 4px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    nav.tabs button .i {
      font-size: 1.45rem;
    }

    nav.tabs button.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    /* 모달 창 (비밀번호 & 부모님 설정) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-card {
      background: var(--bg);
      border: 3px solid var(--border);
      border-radius: 26px;
      width: 100%;
      max-width: 420px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    /* 비밀번호 키패드 */
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 18px 0;
    }

    .pin-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      background: white;
    }

    .pin-dot.filled {
      background: var(--primary);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .key-btn {
      font-family: 'Fredoka', 'Jua', sans-serif;
      font-size: 1.35rem;
      font-weight: 600;
      padding: 14px 0;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--text);
      box-shadow: 0 4px 0 var(--border);
      cursor: pointer;
    }

    .key-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--border);
    }

    .input-field {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 2px solid var(--border);
      font-family: 'Jua', sans-serif;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    /* 토스트 알림 */
    #toast {
      position: fixed;
      bottom: 95px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(51, 46, 42, 0.92);
      color: white;
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 0.95rem;
      z-index: 200;
      display: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- 상단바 -->
  <header>
    <div class="brand">
      <span>🐣</span>
      <span id="headerTitle">예승 English</span>
    </div>
    <div class="header-right">
      <div class="star-badge">
        <span>⭐</span>
        <span id="starCount" class="en">0</span>
      </div>
      <button class="icon-btn" onclick="openPinModal()" title="부모님 관리 메뉴">⚙️</button>
    </div>
  </header>

  <!-- 메인 화면 -->
  <main id="app"></main>

  <!-- 하단 네비게이션 탭 -->
  <nav id="tabs" class="tabs">
    <div class="inner">
      <button data-tab="home" class="active" onclick="switchTab('home')">
        <span class="i">🏠</span>오늘
      </button>
      <button data-tab="listen" onclick="switchTab('listen')">
        <span class="i">🎧</span>듣기
      </button>
      <button data-tab="words" onclick="switchTab('words')">
        <span class="i">📚</span>단어장
      </button>
      <button data-tab="rewards" onclick="switchTab('rewards')">
        <span class="i">🏆</span>보상
      </button>
    </div>
  </nav>

  <!-- 1. 비밀번호(150320) 입력 모달 -->
  <div id="pinModal" class="modal-backdrop">
    <div class="modal-card" style="text-align:center;">
      <h3 style="margin:0 0 6px 0; font-size:1.3rem;">🔒 부모님 확인</h3>
      <p style="margin:0; color:var(--muted); font-size:0.95rem;">관리 메뉴 비밀번호 6자리를 입력해 주세요.</p>
      
      <div class="pin-dots" id="pinDots">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>
      <div id="pinError" style="color:var(--accent); font-size:0.9rem; height:20px; margin-bottom:4px;"></div>

      <div class="keypad">
        <button class="key-btn" onclick="pressPin('1')">1</button>
        <button class="key-btn" onclick="pressPin('2')">2</button>
        <button class="key-btn" onclick="pressPin('3')">3</button>
        <button class="key-btn" onclick="pressPin('4')">4</button>
        <button class="key-btn" onclick="pressPin('5')">5</button>
        <button class="key-btn" onclick="pressPin('6')">6</button>
        <button class="key-btn" onclick="pressPin('7')">7</button>
        <button class="key-btn" onclick="pressPin('8')">8</button>
        <button class="key-btn" onclick="pressPin('9')">9</button>
        <button class="key-btn" style="font-size:1rem;" onclick="closePinModal()">취소</button>
        <button class="key-btn" onclick="pressPin('0')">0</button>
        <button class="key-btn" style="font-size:1.1rem;" onclick="backspacePin()">⬅️</button>
      </div>
    </div>
  </div>

  <!-- 2. 부모님 관리 모달 (비밀번호 통과 후 열림) -->
  <div id="parentModal" class="modal-backdrop">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="margin:0; font-size:1.3rem;">⚙️ 부모님 관리 메뉴</h3>
        <button class="btn btn-outline" style="padding:6px 12px;" onclick="closeParentModal()">닫기 ✕</button>
      </div>

      <!-- 별 포인트 조정 -->
      <div class="card" style="margin-bottom:12px;">
        <div style="margin-bottom:8px;">⭐ <strong>예승이 별 포인트 관리</strong></div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary" style="flex:1;" onclick="adjustStars(10)">+10⭐ 칭찬 선물</button>
          <button class="btn btn-outline" style="flex:1;" onclick="adjustStars(-10)">-10⭐ 차감</button>
        </div>
      </div>

      <!-- 새 단어 추가 -->
      <div class="card" style="margin-bottom:12px;">
        <div style="margin-bottom:8px;">➕ <strong>단어장에 새 단어 추가</strong></div>
        <input id="newWordEn" class="input-field" placeholder="영어 단어 (예: rainbow)">
        <input id="newWordKo" class="input-field" placeholder="한글 뜻 (예: 무지개)">
        <input id="newWordEmoji" class="input-field" placeholder="이모지 (예: 🌈)">
        <button class="btn btn-secondary" style="width:100%;" onclick="addCustomWord()">단어 추가하기</button>
      </div>

      <!-- 새 보상 쿠폰 추가 -->
      <div class="card" style="margin-bottom:12px;">
        <div style="margin-bottom:8px;">🎁 <strong>보상 쿠폰 추가</strong></div>
        <input id="newRewardTitle" class="input-field" placeholder="보상 이름 (예: 보드게임 1판 하기)">
        <input id="newRewardCost" type="number" class="input-field" placeholder="필요한 별 개수 (예: 40)">
        <input id="newRewardIcon" class="input-field" placeholder="아이콘 이모지 (예: 🎲)">
        <button class="btn btn-primary" style="width:100%;" onclick="addCustomReward()">보상 추가하기</button>
      </div>

      <!-- 이름 변경 및 오늘 미션 리셋 -->
      <div class="card" style="margin-bottom:0;">
        <div style="margin-bottom:8px;">🛠️ <strong>기타 설정</strong></div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-outline" style="flex:1;" onclick="resetTodayMission()">🔄 오늘 미션 초기화</button>
          <button class="btn btn-outline" style="flex:1;" onclick="changeChildName()">✏️ 아이 이름 변경</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 토스트 메시지 -->
  <div id="toast"></div>

  <script>
    // 부모님 관리 비밀번호 고정값
    const PARENT_PIN = "150320";
    let currentPinInput = "";

      { id: 26, en: "dad", ko: "아빠", emoji: "👨", cat: "가족·몸" },
      { id: 27, en: "baby", ko: "아기", emoji: "👶", cat: "가족·몸" },
      { id: 28, en: "eye", ko: "눈", emoji: "👀", cat: "가족·몸" },
      { id: 29, en: "hand", ko: "손", emoji: "✋", cat: "가족·몸" },
      { id: 30, en: "smile", ko: "미소", emoji: "😊", cat: "가족·몸" },
      { id: 31, en: "sun", ko: "태양", emoji: "☀️", cat: "자연·색깔" },
      { id: 32, en: "moon", ko: "달", emoji: "🌙", cat: "자연·색깔" },
      { id: 33, en: "star", ko: "별", emoji: "⭐", cat: "자연·색깔" },
      { id: 34, en: "tree", ko: "나무", emoji: "🌳", cat: "자연·색깔" },
      { id: 35, en: "flower", ko: "꽃", emoji: "🌸", cat: "자연·색깔" },
      { id: 36, en: "rain", ko: "비", emoji: "🌧️", cat: "자연·색깔" },
      { id: 37, en: "red", ko: "빨간색", emoji: "🔴", cat: "자연·색깔" },
      { id: 38, en: "blue", ko: "파란색", emoji: "🔵", cat: "자연·색깔" },
      { id: 39, en: "yellow", ko: "노란색", emoji: "🟡", cat: "자연·색깔" },
      { id: 40, en: "green", ko: "초록색", emoji: "🟢", cat: "자연·색깔" }
    ];

    const DEFAULT_REWARDS = [
      { id: 1, title: "맛있는 간식 고르기", cost: 30, icon: "🍦" },
      { id: 2, title: "만화·게임 30분 이용권", cost: 50, icon: "🎮" },
      { id: 3, title: "엄마·아빠와 보드게임 1판", cost: 70, icon: "🎲" },
      { id: 4, title: "주말에 가고 싶은 곳 가기", cost: 150, icon: "🎡" }
    ];

    // 상태 데이터 로드
    const STORAGE_KEY = "yeseung_english_v2";
    let state = loadState();
    let currentTab = "home";
    let selectedCategory = "전체";
    let hideMeanings = false;
    let quizState = null;

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          ensureDailyMission(parsed);
          return parsed;
        } catch (e) {}
      }
      const initial = {
        childName: "예승",
        stars: 0,
        learnedIds: [],
        words: DEFAULT_WORDS,
        rewards: DEFAULT_REWARDS,
        coupons: [],
        daily: {
          date: "",
          wordIds: [],
          completedWordIds: [],
          quizCompleted: 0
        }
      };
      ensureDailyMission(initial);
      return initial;
    }

    function ensureDailyMission(st) {
      const today = getTodayString();
      if (!st.daily || st.daily.date !== today || !st.daily.wordIds || st.daily.wordIds.length === 0) {
        const shuffled = [...st.words].sort(() => Math.random() - 0.5);
        st.daily = {
          date: today,
          wordIds: shuffled.slice(0, 5).map(w => w.id),
          completedWordIds: [],
          quizCompleted: 0
        };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateHeader();
    }

    function updateHeader() {
      document.getElementById("headerTitle").textContent = `${state.childName} English`;
      document.getElementById("starCount").textContent = state.stars;
      document.title = `${state.childName} English`;
    }

    // 음성 합성 (TTS)
    function speakWord(text, rate = 0.9) {
      if (!("speechSynthesis" in window)) {
        showToast("이 기기에서는 음성 재생을 지원하지 않아요.");
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.rate = rate;
      utter.pitch = 1.05;
      window.speechSynthesis.speak(utter);
    }

    // 효과음 (Web Audio API)
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === "ding") {
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else if (type === "wrong") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        }
      } catch (e) {}
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        t.style.display = "none";
      }, 2200);
    }

    // 탭 전환
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll("nav.tabs button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      if (tab === "listen" && !quizState) {
        startNewQuiz();
      }
      render();
    }

    function render() {
      updateHeader();
      const app = document.getElementById("app");
      if (currentTab === "home") renderHome(app);
      else if (currentTab === "listen") renderListen(app);
      else if (currentTab === "words") renderWords(app);
      else if (currentTab === "rewards") renderRewards(app);
    }

    // 1. 홈(오늘) 화면
    function renderHome(app) {
      const todayWords = state.daily.wordIds
        .map(id => state.words.find(w => w.id === id))
        .filter(Boolean);
      const doneCount = state.daily.completedWordIds.length;

      app.innerHTML = `
        <div class="card greeting-banner">
          <h2>안녕, ${state.childName}아! 👋</h2>
          <p>오늘의 영단어 카드를 눌러 발음을 듣고 별을 모아봐요!</p>
          <div class="progress-row">
            <div class="progress-pill">
              <span>📖 오늘 단어</span>
              <strong>${doneCount} / ${todayWords.length}</strong>
            </div>
            <div class="progress-pill">
              <span>🎧 듣기 퀴즈</span>
              <strong>${state.daily.quizCompleted}회 완료</strong>
            </div>
          </div>
        </div>

        <div class="section-title">
          <span>🌟 오늘의 단어 5개</span>
          <span style="font-size:0.9rem; color:var(--muted);">터치하면 읽어줘요 🔊</span>
        </div>

        <div>
          ${todayWords.map(w => {
            const isDone = state.daily.completedWordIds.includes(w.id);
            return `
              <div class="word-item ${isDone ? 'done' : ''}">
                <div class="word-left" onclick="speakWord('${w.en}')">
                  <div class="word-emoji">${w.emoji}</div>
                  <div class="word-text">
                    <div class="en-word en">${w.en} <span style="font-size:1rem;">🔊</span></div>
                    <div class="ko-word">${w.ko}</div>
                  </div>
                </div>
                ${isDone 
                  ? `<button class="btn btn-done" onclick="speakWord('${w.en}')">완료 ✔</button>`
                  : `<button class="btn btn-primary" onclick="completeTodayWord(${w.id})">+5⭐ 외웠어요</button>`
                }
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function completeTodayWord(wordId) {
      const word = state.words.find(w => w.id === wordId);
      if (word) speakWord(word.en);
      if (!state.daily.completedWordIds.includes(wordId)) {
        state.daily.completedWordIds.push(wordId);
        if (!state.learnedIds.includes(wordId)) state.learnedIds.push(wordId);
        state.stars += 5;
        playSound("ding");
        showToast("참 잘했어요! +5⭐ 별을 획득했어요!");
        saveState();
        render();
      }
    }

    // 2. 듣기 퀴즈 화면
    function startNewQuiz() {
      const pool = [...state.words].sort(() => Math.random() - 0.5);
      const questions = pool.slice(0, 5).map(answer => {
        const distractors = state.words
          .filter(w => w.id !== answer.id)
          .sort(() => Math.random() - 0.5)
          .slice(0, 3);
        const options = [answer, ...distractors].sort(() => Math.random() - 0.5);
        return { answer, options };
      });
      quizState = {
        index: 0,
        score: 0,
        questions,
        answered: false
      };
      setTimeout(() => {
        if (quizState && quizState.questions[0]) {
          speakWord(quizState.questions[0].answer.en);
        }
      }, 250);
    }

    function renderListen(app) {
      if (!quizState) startNewQuiz();

      if (quizState.index >= quizState.questions.length) {
        app.innerHTML = `
          <div class="card quiz-box">
            <div style="font-size:4rem;">🎉</div>
            <h2 style="margin:10px 0;">듣기 퀴즈 완료!</h2>
            <p style="color:var(--muted); font-size:1.1rem;">
              5문제 중 <strong>${quizState.score}문제</strong>를 맞혔어요!
            </p>
            <button class="btn btn-primary" style="margin-top:16px; padding:14px 28px; font-size:1.1rem;" onclick="startNewQuiz(); render();">
              🎧 한 번 더 도전하기
            </button>
          </div>
        `;
        return;
      }

      const q = quizState.questions[quizState.index];
      app.innerHTML = `
        <div class="card quiz-box">
          <div style="display:flex; justify-content:space-between; color:var(--muted); font-size:0.95rem;">
            <span>문제 ${quizState.index + 1} / 5</span>
            <span>맞힌 개수: ${quizState.score}개</span>
          </div>

          <button class="speaker-big" onclick="speakWord('${q.answer.en}', 0.9)">🔊</button>
          <div>
            <button class="btn btn-outline" onclick="speakWord('${q.answer.en}', 0.6)">🐢 천천히 다시 듣기</button>
          </div>

          <div class="quiz-grid">
            ${q.options.map(opt => `
              <button class="quiz-option" id="opt-${opt.id}" onclick="submitQuizOption(${opt.id})">
                <span style="font-size:2.4rem;">${opt.emoji}</span>
                <span style="font-size:1.1rem;">${opt.ko}</span>
                <span class="en" style="font-size:0.9rem; color:var(--muted);">${opt.en}</span>
              </button>
            `).join("")}
          </div>
        </div>
      `;
    }

    function submitQuizOption(selectedId) {
      if (!quizState || quizState.answered) return;
      const q = quizState.questions[quizState.index];
      const btn = document.getElementById(`opt-${selectedId}`);

      if (selectedId === q.answer.id) {
        quizState.answered = true;
        quizState.score += 1;
        state.stars += 3;
        btn.classList.add("correct");
        playSound("ding");
        speakWord(q.answer.en);
        saveState();

        setTimeout(() => {
          quizState.index += 1;
          quizState.answered = false;
          if (quizState.index >= quizState.questions.length) {
            state.stars += 10;
            state.daily.quizCompleted += 1;
            showToast("퀴즈 완주 보너스 +10⭐ 지급!");
            saveState();
          } else {
            speakWord(quizState.questions[quizState.index].answer.en);
          }
          render();
        }, 900);
      } else {
        btn.classList.add("wrong");
        playSound("wrong");
        showToast("다시 한 번 소리를 들어볼까요? 🎧");
        speakWord(q.answer.en, 0.75);
      }
    }

    // 3. 단어장 화면
    function renderWords(app) {
      const categories = ["전체", "음식", "동물", "학교", "가족·몸", "자연·색깔", "추가단어"];
      const filtered = selectedCategory === "전체"
        ? state.words
        : state.words.filter(w => w.cat === selectedCategory);

      app.innerHTML = `
        <div class="cat-scroll">
          ${categories.map(cat => `
            <button class="cat-chip ${selectedCategory === cat ? 'active' : ''}" onclick="selectCategory('${cat}')">
              ${cat}
            </button>
          `).join("")}
        </div>

        <div class="section-title">
          <span>📚 총 ${filtered.length}개 단어</span>
          <button class="btn btn-outline" style="padding:6px 12px; font-size:0.9rem;" onclick="toggleMeaningMask()">
            ${hideMeanings ? "👀 뜻 보이기" : "🙈 뜻 가리기(암기모드)"}
          </button>
        </div>

        <div>
          ${filtered.map(w => `
            <div class="word-item" onclick="speakWord('${w.en}')">
              <div class="word-left">
                <div class="word-emoji">${w.emoji}</div>
                <div class="word-text">
                  <div class="en-word en">${w.en} <span style="font-size:0.95rem;">🔊</span></div>
                  <div class="ko-word ${hideMeanings ? 'masked' : ''}" onclick="event.stopPropagation(); this.classList.toggle('masked');">
                    ${w.ko}
                  </div>
                </div>
              </div>
              <span style="font-size:0.85rem; color:var(--muted);">${w.cat}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      render();
    }

    function toggleMeaningMask() {
      hideMeanings = !hideMeanings;
      render();
    }

    // 4. 보상 화면
    function renderRewards(app) {
      app.innerHTML = `
        <div class="card" style="text-align:center; background:#FFFDF9;">
          <div style="font-size:0.95rem; color:var(--muted);">✨ ${state.childName}이의 별 주머니</div>
          <div class="en" style="font-size:2.4rem; font-weight:700; color:var(--primary); margin:6px 0;">
            ⭐ ${state.stars}
          </div>
          <div style="font-size:0.9rem; color:var(--muted);">모은 별로 엄마·아빠와 약속한 쿠폰을 교환해요!</div>
        </div>

        <div class="section-title">🎁 보상 쿠폰 교환소</div>
        <div>
          ${state.rewards.map(r => `
            <div class="word-item">
              <div class="word-left" style="cursor:default;">
                <div class="word-emoji">${r.icon}</div>
                <div class="word-text">
                  <div style="font-size:1.1rem;">${r.title}</div>
                  <div class="en" style="color:var(--primary); font-weight:600;">⭐ ${r.cost}개 필요</div>
                </div>
              </div>
              <button class="btn ${state.stars >= r.cost ? 'btn-primary' : 'btn-outline'}" onclick="buyReward(${r.id})">
                교환하기
              </button>
            </div>
          `).join("")}
        </div>

        <div class="section-title" style="margin-top:20px;">🎟️ 내 쿠폰함 (${state.coupons.length}장)</div>
        <div>
          ${state.coupons.length === 0
            ? `<div class="card" style="text-align:center; color:var(--muted);">아직 교환한 쿠폰이 없어요.</div>`
            : state.coupons.map(c => `
              <div class="word-item">
                <div class="word-left" style="cursor:default;">
                  <div class="word-emoji">${c.icon}</div>
                  <div class="word-text">
                    <div style="font-size:1.05rem;">${c.title}</div>
                    <div style="font-size:0.85rem; color:var(--muted);">${c.date} 교환</div>
                  </div>
                </div>
                <button class="btn btn-secondary" onclick="useCoupon('${c.uid}')">사용 완료</button>
              </div>
            `).join("")
          }
        </div>
      `;
    }

    function buyReward(rewardId) {
      const r = state.rewards.find(item => item.id === rewardId);
      if (!r) return;
      if (state.stars < r.cost) {
        playSound("wrong");
        showToast(`별이 ${r.cost - state.stars}개 더 필요해요!`);
        return;
      }
      state.stars -= r.cost;
      state.coupons.unshift({
        uid: Date.now().toString(),
        title: r.title,
        icon: r.icon,
        date: getTodayString()
      });
      playSound("ding");
      showToast(`🎉 '${r.title}' 쿠폰을 교환했어요!`);
      saveState();
      render();
    }

    function useCoupon(uid) {
      if (!confirm("부모님께 보여드리고 쿠폰을 사용 완료할까요?")) return;
      state.coupons = state.coupons.filter(c => c.uid !== uid);
      saveState();
      render();
      showToast("쿠폰을 사용 완료했어요!");
    }

    // 🔒 부모님 비밀번호 모달 제어 (비밀번호: 150320)
    function openPinModal() {
      currentPinInput = "";
      document.getElementById("pinError").textContent = "";
      updatePinDots();
      document.getElementById("pinModal").classList.add("show");
    }

    function closePinModal() {
      document.getElementById("pinModal").classList.remove("show");
      currentPinInput = "";
    }

    function pressPin(digit) {
      if (currentPinInput.length >= 6) return;
      currentPinInput += digit;
      document.getElementById("pinError").textContent = "";
      updatePinDots();

      if (currentPinInput.length === 6) {
        if (currentPinInput === PARENT_PIN) {
          playSound("ding");
          closePinModal();
          openParentModal();
        } else {
          playSound("wrong");
          document.getElementById("pinError").textContent = "비밀번호가 일치하지 않습니다.";
          setTimeout(() => {
            currentPinInput = "";
            updatePinDots();
          }, 450);
        }
      }
    }

    function backspacePin() {
      currentPinInput = currentPinInput.slice(0, -1);
      updatePinDots();
    }

    function updatePinDots() {
      const dots = document.querySelectorAll("#pinDots .pin-dot");
      dots.forEach((dot, idx) => {
        dot.classList.toggle("filled", idx < currentPinInput.length);
      });
    }

    // ⚙️ 부모님 관리 모달 기능
    function openParentModal() {
      document.getElementById("parentModal").classList.add("show");
    }

    function closeParentModal() {
      document.getElementById("parentModal").classList.remove("show");
    }

    function adjustStars(delta) {
      state.stars = Math.max(0, state.stars + delta);
      saveState();
      render();
      showToast(delta > 0 ? `+${delta}⭐ 지급 완료!` : `${delta}⭐ 차감 완료!`);
    }

    function addCustomWord() {
      const en = document.getElementById("newWordEn").value.trim();
      const ko = document.getElementById("newWordKo").value.trim();
      const emoji = document.getElementById("newWordEmoji").value.trim() || "📘";
      if (!en || !ko) {
        showToast("영어 단어와 한글 뜻을 모두 입력해 주세요.");
        return;
      }
      state.words.unshift({
        id: Date.now(),
        en,
        ko,
        emoji,
        cat: "추가단어"
      });
      document.getElementById("newWordEn").value = "";
      document.getElementById("newWordKo").value = "";
      document.getElementById("newWordEmoji").value = "";
      saveState();
      render();
      showToast(`'${en}' 단어가 추가되었습니다!`);
    }

    function addCustomReward() {
      const title = document.getElementById("newRewardTitle").value.trim();
      const cost = parseInt(document.getElementById("newRewardCost").value, 10);
      const icon = document.getElementById("newRewardIcon").value.trim() || "🎁";
      if (!title || isNaN(cost) || cost <= 0) {
        showToast("보상 이름과 필요한 별 개수를 입력해 주세요.");
        return;
      }
      state.rewards.push({
        id: Date.now(),
        title,
        cost,
        icon
      });
      document.getElementById("newRewardTitle").value = "";
      document.getElementById("newRewardCost").value = "";
      document.getElementById("newRewardIcon").value = "";
      saveState();
      render();
      showToast(`'${title}' 보상이 추가되었습니다!`);
    }

    function resetTodayMission() {
      state.daily.date = "";
      ensureDailyMission(state);
      saveState();
      render();
      showToast("오늘의 단어 5개가 새로 뽑혔습니다!");
    }

    function changeChildName() {
      const newName = prompt("아이 이름을 입력해 주세요:", state.childName);
      if (newName && newName.trim()) {
        state.childName = newName.trim();
        saveState();
        render();
        showToast(`이름이 '${state.childName}'(으)로 변경되었습니다.`);
      }
    }

    // 초기 실행
    render();
  </script>
</body>
</html>
